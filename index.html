<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플라스틱 vs 생명체 분자 분해 비교</title>
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            text-align: center; 
            background-color: #f4f9f9; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { color: #2c3e50; font-size: 2rem; margin-bottom: 10px; }
        
        p.desc { 
            color: #333; 
            font-size: 1.4rem; 
            word-break: keep-all; 
            line-height: 1.5; 
            margin-top: 5px;
            font-weight: bold;
        }
        
        .container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            margin-top: 20px; 
            gap: 20px; 
        }
        .panel { 
            background: white; 
            border-radius: 15px; 
            padding: 20px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
        }
        .panel h2 { margin-top: 0; padding-bottom: 10px; border-bottom: 2px dashed #eee; font-size: 1.5rem; }
        .natural h2 { color: #27ae60; }
        .synthetic h2 { color: #7f8c8d; }
        
        .highlight-text-nat {
            font-size: 1.3rem;
            font-weight: 900;
            color: #27ae60;
            margin-top: 10px;
            margin-bottom: 5px;
            display: inline-block;
        }
        .highlight-text-syn {
            font-size: 1.3rem;
            font-weight: 900;
            color: #c0392b;
            margin-top: 10px;
            margin-bottom: 5px;
            display: inline-block;
        }
        
        .molecule-container { 
            flex-grow: 1; 
            height: 320px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            background-color: #fafafa; 
            border-radius: 10px; 
            border: 1px solid #eee; 
            margin-top: 10px; 
            overflow: visible; 
        }
        
        .molecule { 
            display: flex; 
            align-items: center; 
            flex-wrap: wrap; 
            justify-content: center; 
            transition: all 1s ease; 
            position: relative; 
            z-index: 1; 
        }
        .atom-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 1s ease;
        }
        .atom { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 20px; 
            font-weight: bold; 
            color: white; 
            position: relative; 
            transition: all 1s ease; 
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.2); 
        }
        
        /* 생명체(천연 고분자) 스타일 */
        .natural .atom { width: 60px; height: 60px; border-radius: 50%; background-color: #2ecc71; margin: 0; }
        .natural .bond { 
            width: 35px; 
            height: 30px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 26px; 
            transition: all 0.5s ease;
            margin: 0 -2px;
            z-index: 2;
        }
        
        /* 플라스틱(합성 고분자) 스타일 */
        .synthetic .atom { width: 60px; height: 60px; border-radius: 50%; background-color: #34495e; margin: 0; font-size: 24px; }
        .synthetic .bond { 
            width: 30px; 
            height: 30px; 
            position: relative; 
            margin: 0 0px;
            transition: all 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .synthetic .bond::before, .synthetic .bond::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 6px;
            background-color: #2c3e50; 
            border-radius: 3px;
        }
        .synthetic .bond::before { transform: rotate(45deg); }
        .synthetic .bond::after { transform: rotate(-45deg); }
        
        /* 미생물 스타일 */
        .microbe { 
            position: absolute; 
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; 
            transition: all 1s ease; 
            z-index: 10; 
            transform: translate(-50%, -50%);
        }
        .emoji {
            font-size: 45px; 
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            transition: all 0.5s ease;
        }
        
        /* 독립적인 말풍선 스타일 */
        .speech-bubble { 
            position: absolute; 
            top: 15%; 
            left: 50%;
            transform: translateX(-50%);
            background: white; 
            border-radius: 15px; 
            padding: 12px 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            font-size: 15px; 
            font-weight: bold; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
            width: 80%;
            max-width: 250px;
            text-align: center; 
            line-height: 1.4; 
            pointer-events: none; 
            word-break: keep-all;
            z-index: 20;
        }
        .speech-bubble::after { 
            content: ''; 
            position: absolute; 
            top: 100%; 
            left: 50%;
            transform: translateX(-50%);
            border-style: solid; 
            border-width: 12px 10px 0; 
            display: block; 
            width: 0; 
            z-index: 1; 
        }
        .bubble-nat { border: 3px solid #2ecc71; color: #27ae60; }
        .bubble-nat::after { border-color: #2ecc71 transparent transparent transparent; }
        
        .bubble-syn { border: 3px solid #e74c3c; color: #c0392b; }
        .bubble-syn::after { border-color: #e74c3c transparent transparent transparent; }
        
        /* 버튼 */
        button { 
            background-color: #3498db; 
            border: none; 
            color: white; 
            padding: 15px 20px; 
            text-align: center; 
            font-size: 1.3rem; 
            margin: 20px auto; 
            cursor: pointer; 
            border-radius: 30px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.15); 
            transition: background-color 0.3s, transform 0.1s; 
            font-weight: bold; 
            width: 90%;
            max-width: 500px;
            display: block;
        }
        button:hover { background-color: #2980b9; transform: translateY(-2px); }
        button:active { transform: translateY(1px); }
        
        /* 결과물 라벨 */
        .result-label { 
            position: absolute; 
            font-size: 13px; 
            font-weight: bold; 
            color: #2980b9; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 3px 8px; 
            border-radius: 12px; 
            border: 2px solid #3498db; 
            margin-top: 65px; 
            opacity: 0; 
            transition: opacity 1s ease;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <h1>🔬 플라스틱 vs 생명체 분자 분해 시뮬레이터</h1>
    <p class="desc">
        천연 고분자(당)와 합성 고분자(탄소)의 결합 구조를 비교해 봅시다.<br>
        과연 미생물의 효소 가위로 둘 다 분해할 수 있을까요?
    </p>

    <!-- 버튼 텍스트 고정 -->
    <button onclick="nextStep()" id="actionBtn">다음 단계</button>

    <div class="container">
        <!-- 생명체 (천연 고분자) -->
        <div class="panel natural" id="naturalPanel">
            <h2>🌱 생명체 분자 (천연 고분자)</h2>
            <div class="highlight-text-nat">(가볍게 손을 맞잡고 있는 형태 🤝)</div>
            <div class="molecule-container" id="naturalContainer">
                <div class="speech-bubble bubble-nat" id="natBubble"></div>
                <div class="microbe nat-microbe" id="natMicrobe1"><div class="emoji nat-emoji">🦠</div></div>
                <div class="microbe nat-microbe" id="natMicrobe2"><div class="emoji nat-emoji">🦠</div></div>
                <div class="microbe nat-microbe" id="natMicrobe3"><div class="emoji nat-emoji">🦠</div></div>
                
                <div id="naturalMolecule"></div>
            </div>
        </div>

        <!-- 플라스틱 (합성 고분자) -->
        <div class="panel synthetic" id="syntheticPanel">
            <h2>🥤 플라스틱 (합성 고분자)</h2>
            <div class="highlight-text-syn">(서로 꽉 팔짱을 끼고 있는 형태 ❌)</div>
            <div class="molecule-container" id="syntheticContainer">
                <div class="speech-bubble bubble-syn" id="synBubble"></div>
                <div class="microbe syn-microbe" id="synMicrobe1"><div class="emoji syn-emoji">🦠</div></div>
                <div class="microbe syn-microbe" id="synMicrobe2"><div class="emoji syn-emoji">🦠</div></div>
                <div class="microbe syn-microbe" id="synMicrobe3"><div class="emoji syn-emoji">🦠</div></div>
                
                <div id="syntheticMolecule"></div>
            </div>
        </div>
    </div>

    <script>
        let step = 0; 

        function initSimulation() {
            createMolecule('naturalMolecule', 4, 'natural');
            createMolecule('syntheticMolecule', 4, 'synthetic');
            resetElements();
        }

        function createMolecule(containerId, atomCount, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const molecule = document.createElement('div');
            molecule.className = 'molecule';
            molecule.id = type + 'Chain';
            
            for(let i=0; i<atomCount; i++) {
                const atomWrapper = document.createElement('div');
                atomWrapper.className = 'atom-wrapper';

                const atom = document.createElement('div');
                atom.className = 'atom';
                atom.innerText = type === 'natural' ? '당' : 'C';
                atomWrapper.appendChild(atom);
                
                if(type === 'natural') {
                    const label = document.createElement('div');
                    label.className = 'result-label';
                    label.innerText = i % 2 === 0 ? '물(H₂O)' : '이산화탄소(CO₂)';
                    atomWrapper.appendChild(label);
                }

                molecule.appendChild(atomWrapper);
                
                if(i < atomCount - 1) {
                    const bond = document.createElement('div');
                    bond.className = 'bond';
                    bond.id = type + 'Bond' + (i + 1);
                    if(type === 'natural') {
                        bond.innerText = '🤝';
                    }
                    molecule.appendChild(bond);
                }
            }
            container.appendChild(molecule);
        }

        function resetElements() {
            const natMicrobes = document.querySelectorAll('.nat-microbe');
            const synMicrobes = document.querySelectorAll('.syn-microbe');
            
            natMicrobes.forEach(m => { m.style.opacity = '0'; m.style.left = '10%'; m.style.top = '10%'; });
            synMicrobes.forEach(m => { m.style.opacity = '0'; m.style.left = '10%'; m.style.top = '10%'; });
            
            document.querySelectorAll('.nat-emoji').forEach(e => { e.innerText = '🦠'; e.style.transform = 'none'; });
            document.querySelectorAll('.syn-emoji').forEach(e => { e.innerText = '🦠'; e.style.transform = 'none'; });

            document.getElementById('natBubble').style.opacity = '0';
            document.getElementById('synBubble').style.opacity = '0';
        }

        function moveMicrobesToBonds(type) {
            const container = document.getElementById(type + 'Container');
            const containerRect = container.getBoundingClientRect();
            const bonds = document.querySelectorAll('#' + type + 'Chain .bond');
            const prefix = type === 'natural' ? 'nat' : 'syn';
            
            bonds.forEach((bond, idx) => {
                const microbe = document.getElementById(prefix + 'Microbe' + (idx + 1));
                if(microbe && bond) {
                    const bondRect = bond.getBoundingClientRect();
                    // 미생물이 결합부위(손/X) 정중앙에 정확히 겹치도록 좌표 계산 수정 (bondRect의 중앙)
                    const relLeft = bondRect.left - containerRect.left + (bondRect.width / 2);
                    const relTop = bondRect.top - containerRect.top + (bondRect.height / 2); 
                    
                    microbe.style.left = relLeft + 'px';
                    microbe.style.top = relTop + 'px';
                    microbe.style.opacity = '1';
                }
            });
        }

        function nextStep() {
            if (step === 0) {
                moveMicrobesToBonds('natural');
                moveMicrobesToBonds('synthetic');
                step = 1;

            } else if (step === 1) {
                const natBubble = document.getElementById('natBubble');
                natBubble.innerText = "가볍게 손만 맞잡고 있네? 내 효소 가위로 톡 끊어주지! ✂️";
                natBubble.style.opacity = '1';

                const synBubble = document.getElementById('synBubble');
                synBubble.innerText = "자기들끼리 꽉 팔짱을 끼고 있잖아! 빈틈이 없어서 가위가 안 들어가! 💦";
                synBubble.style.opacity = '1';
                step = 2;

            } else if (step === 2) {
                const natBubble = document.getElementById('natBubble');
                natBubble.innerText = "물과 이산화탄소로 분해 완료!";
                document.querySelectorAll('.nat-emoji').forEach(e => e.innerText = '😋');

                const synBubble = document.getElementById('synBubble');
                synBubble.innerText = "분하다. 낯선 결합이 너무 강력하다";
                document.querySelectorAll('.syn-emoji').forEach(e => e.innerText = '😵');
                
                processDecomposition();
                step = 3;

            } else if (step === 3) {
                initSimulation();
                step = 0;
            }
        }

        function processDecomposition() {
            const natChain = document.getElementById('naturalChain');
            const natWrappers = natChain.querySelectorAll('.atom-wrapper');
            const natBonds = natChain.querySelectorAll('.bond');
            const natLabels = natChain.querySelectorAll('.result-label');
            
            natBonds.forEach(bond => {
                bond.style.opacity = '0';
                bond.style.width = '0px'; 
                bond.style.margin = '0px';
                bond.innerText = '';
            });
            
            natWrappers.forEach((wrapper, idx) => {
                const atom = wrapper.querySelector('.atom');
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 50; 
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 30; 
                
                wrapper.style.transform = `translate(${tx}px, ${ty}px)`;
                
                atom.style.opacity = '0.9';
                atom.innerText = idx % 2 === 0 ? '💧' : '💨';
                atom.style.backgroundColor = idx % 2 === 0 ? '#3498db' : '#95a5a6'; 
            });

            natLabels.forEach(label => label.style.opacity = '1');

            const synChain = document.getElementById('syntheticChain');
            let shake = setInterval(() => {
                synChain.style.transform = `translateX(${(Math.random() - 0.5) * 12}px)`;
            }, 50);
            setTimeout(() => {
                clearInterval(shake);
                synChain.style.transform = 'translateX(0)';
            }, 800);
        }

        window.onload = () => {
            initSimulation();
            window.addEventListener('resize', () => {
                if (step > 0 && step < 3) {
                    moveMicrobesToBonds('natural');
                    moveMicrobesToBonds('synthetic');
                }
            });
        };
    </script>
</body>
</html>
